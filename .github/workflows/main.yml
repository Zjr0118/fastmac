name: fastmac
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: chmod script
        run: chmod +x script-mac.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        id: tmate
        with:
          detached: true

      - name: run mac script
        run: ./script-mac.sh
        env:
          TMATE_SSH: ${{ steps.tmate.outputs.tmate-ssh }}
          TMATE_WEB_URL: ${{ steps.tmate.outputs.tmate-web-url }}

      - name: keep session alive
        run: sleep 6h
